<title>시우링고</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 화면 앱. 홈 = 레벨 탭 + 카테고리 10칸 격자, 카테고리 시트 = 3단계(듣고 쓰기·뜻 보고 쓰기·짝맞추기), 레슨 = 진행바 · 캐릭터 무대 · 문제 · 피드백 시트 */
:root{
  --bg:#E4F3EA; --bg2:#D2E9DB; --ink:#1E2B37; --soft:#5A6C78; --card:#FFFFFF; --line:#C6DACE;
  --go:#FF8A3D; --go-d:#D8661C; --ok:#22A563; --ok-d:#17804B; --ok-bg:#D5F4E2;
  --no:#E5484D; --no-d:#B82F34; --no-bg:#FFE3E3; --sky:#3E95E6; --sky-d:#2672BD; --star:#FFC22E; --vow:#F0640F; --hint:#FFF1C7;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --word:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#app{height:100%;max-width:820px;margin:0 auto;position:relative;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 그림 */
.swatch{display:inline-block;width:1em;height:1em;border-radius:50%;border:4px solid rgba(30,43,55,.15);vertical-align:middle}
.numpic{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .15em;border-radius:.35em;background:var(--sky);color:#fff;font-family:var(--display);font-size:.62em;line-height:1;box-shadow:0 .08em 0 var(--sky-d)}

/* ---------- 캐릭터 ---------- */
.critter{display:inline-block;line-height:0;cursor:pointer}
.critter svg{width:100%;height:100%;overflow:visible}
.critter .bod{transform-origin:60px 116px;animation:breathe 3.2s ease-in-out infinite}
.critter .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.3s infinite}
.critter .pupil{transition:transform .35s ease-out}
.critter .mouth-open,.critter .happy-eyes{display:none}
.critter.talk .mouth-closed{display:none}
.critter.talk .mouth-open{display:block;transform-box:fill-box;transform-origin:center;animation:yap .2s infinite alternate}
.critter.happy .eye-open{display:none}
.critter.happy .happy-eyes{display:block}
.critter.happy .bod{animation:hop .45s ease-out 2}
.critter.happy .arm{transform-box:fill-box;transform-origin:50% 10%;animation:wave .3s ease-in-out 3 alternate}
.critter.happy .ar{animation-name:waveR}
.critter.oops .bod{animation:wobble .7s ease}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes yap{from{transform:scaleY(.25)}to{transform:scaleY(1.05)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-16px) scale(.96,1.05)}}
@keyframes wave{to{transform:rotate(55deg)}}
@keyframes waveR{to{transform:rotate(-55deg)}}
@keyframes wobble{20%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- 홈 ---------- */
.hbar{display:flex;align-items:center;gap:8px;padding-block:12px 8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:30px;color:var(--ok-d);margin-right:auto;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.btnchip{border-bottom-width:4px}
.homebody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;display:flex;flex-direction:column;gap:12px}
.greet{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px}
.greet .critter{width:70px;height:70px;flex:none}
.greet .gt{font-family:var(--display);font-size:20px}
.greet .gs{font-size:14px;color:var(--soft)}
.dots{display:flex;gap:6px;margin-left:auto;flex:none}
.dots i{width:20px;height:20px;border-radius:50%;background:var(--bg2);border:2px solid var(--line)}
.dots i.on{background:var(--go);border-color:var(--go-d)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:0;border:none;border-radius:16px;padding:10px 8px;background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-family:var(--body);font-size:12px;color:var(--soft)}
.tab.on{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.tab.on small{color:#E5FFF0}
.tab:disabled{opacity:.55;cursor:default}
.lvprog{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:16px;color:var(--soft)}
.lvbar{flex:1;height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--star);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cat{position:relative;border:none;background:var(--card);border-radius:22px;padding:14px 10px 12px;box-shadow:0 6px 0 var(--hd);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s}
.cat:active{transform:translateY(4px);box-shadow:0 2px 0 var(--hd)}
.cat .ic{width:76px;height:76px;border-radius:50%;background:var(--hc);display:grid;place-items:center;font-size:42px;line-height:1}
.cat .cn{font-family:var(--display);font-size:19px}
.cat .cs{display:flex;gap:4px}
.cat .cs svg{width:18px;height:18px;fill:#D3DDD7}
.cat .cs svg.f{fill:var(--star)}
.cat.clear .ic::after{content:"✔";position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font-size:16px;display:grid;place-items:center}
.cat.next{animation:bob 1.6s ease-in-out infinite}
.cat.next::before{content:"다음!";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--go);color:#fff;font-family:var(--display);font-size:14px;padding:2px 10px;border-radius:99px;box-shadow:0 2px 0 var(--go-d);white-space:nowrap}

/* ---------- 카테고리 시트 / 오버레이 ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,43,55,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--bg);width:100%;max-width:620px;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.link{border:none;background:none;color:var(--soft);font-family:var(--display);font-size:17px;padding:6px 10px}
.catHead{display:flex;align-items:center;gap:10px}
.catHead .critter{width:80px;height:80px;flex:none}
.say{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-family:var(--display);font-size:18px}
.wprev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wp{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wp .e{font-size:30px;line-height:1.15}
.wp .w{font-family:var(--word);font-weight:700;font-size:17px}
.wp .k{font-size:12px;color:var(--soft)}
.wp.got{border-color:var(--ok);background:var(--ok-bg)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;border:none;border-radius:18px;padding:12px 14px;background:var(--card);box-shadow:0 5px 0 var(--line);text-align:left}
.step .si{width:52px;height:52px;border-radius:14px;background:var(--hc);display:grid;place-items:center;font-size:28px;flex:none}
.step .st{font-family:var(--display);font-size:20px}
.step .sd{font-size:13px;color:var(--soft)}
.step .ss{margin-left:auto;display:flex;gap:2px;flex:none}
.step .ss svg{width:20px;height:20px;fill:#D3DDD7}
.step .ss svg.f{fill:var(--star)}
.step.go{box-shadow:0 5px 0 var(--go-d);outline:3px solid var(--go)}
.step:disabled{opacity:.5;cursor:default}
.step:active:not(:disabled){transform:translateY(3px)}

/* ---------- 레슨 ---------- */
.ltop{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.x{width:40px;height:40px;border:none;background:none;font-size:26px;color:var(--soft);flex:none}
.bar{flex:1;height:18px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.6,1);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.35)}
.combo{font-family:var(--display);font-size:17px;color:var(--go-d);white-space:nowrap;min-width:72px;text-align:right}
.combo.pop{animation:pop .35s}
.stage{display:flex;align-items:flex-end;gap:10px;padding-block:4px;min-height:96px;width:100%;max-width:620px;margin:0 auto}
.stage .critter{width:90px;height:90px;flex:none}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--display);font-size:20px;margin-bottom:30px;text-wrap:balance}
.bubble::before{content:"";position:absolute;left:-10px;bottom:12px;border:8px solid transparent;border-right-color:var(--line)}
.bubble.pop{animation:pop .3s ease}
.q{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:6px 160px}
.q>*:first-child{margin-top:auto}
.q>*:last-child{margin-bottom:auto}
.pic{font-size:84px;line-height:1.1}
.pic.big{font-size:110px;animation:pop .5s ease}
.pic.sm{font-size:64px}
.kor{font-family:var(--display);font-size:22px;color:var(--soft)}
.kor.big{font-size:48px;color:var(--ink);animation:pop .4s}
.word{font-family:var(--word);font-weight:700;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.lt{font-family:var(--word);font-weight:700;font-size:clamp(30px,8vw,50px);min-width:1.25em;height:1.5em;padding:0 .1em;border-radius:14px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .12s}
.lt.v,.v{color:var(--vow)}
.lt.on{background:var(--hint);border-color:var(--star);transform:translateY(-6px) scale(1.06)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.spk{width:84px;height:84px;border-radius:50%;border:none;background:var(--sky);color:#fff;box-shadow:0 6px 0 var(--sky-d);display:grid;place-items:center;flex:none}
.spk svg{width:44px;height:44px}
.spk.sm{width:60px;height:60px;box-shadow:0 4px 0 var(--sky-d)}
.spk.sm svg{width:32px;height:32px}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.hintbtn{border:2px dashed var(--star);background:var(--hint);border-radius:14px;padding:8px 14px;font-family:var(--display);font-size:17px}
/* 철자 쓰기 */
.spell{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:620px}
.slots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,56px));gap:6px;justify-content:center;width:100%}
.slot{aspect-ratio:.82;border-bottom:5px solid var(--line);font-family:var(--word);font-weight:700;font-size:clamp(24px,7vw,46px);display:grid;place-items:center;line-height:1;background:rgba(255,255,255,.5);border-radius:10px 10px 4px 4px}
.slot.cur{border-color:var(--sky);background:#fff}
.slots.ok .slot{border-color:var(--ok);color:var(--ok-d);background:var(--ok-bg)}
.slots.no{animation:shake .4s}
.slots.no .slot.good{border-color:var(--ok);color:var(--ok-d);background:var(--ok-bg)}
.slots.no .slot.bad{border-color:var(--no);color:var(--no-d);background:var(--no-bg);text-decoration:line-through;text-decoration-thickness:3px}
.answer{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;animation:pop .35s}
.answer .al{font-family:var(--display);font-size:16px;color:var(--soft)}
.answer .slot{border-color:var(--line);color:var(--ink);background:#fff}
.answer .slot.fix{border-color:var(--star);background:var(--hint);color:var(--vow);transform:translateY(-3px)}
.bank.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tile{font-family:var(--word);font-weight:700;font-size:38px;width:60px;height:66px;background:var(--card);border:3px solid var(--line);border-bottom-width:7px;border-radius:14px;line-height:1}
.tile.used{visibility:hidden}
.tile:active,.key:active{transform:translateY(3px)}
.tile.del,.key.del{background:var(--bg2);font-family:var(--body);font-size:26px}
.bank.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:620px}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:56px;height:56px;padding:0;font-family:var(--word);font-weight:700;font-size:clamp(20px,5vw,30px);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;line-height:1}
.key.del{flex:1.5;max-width:84px}
/* 뜻 고르기 */
.kopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:520px}
.kopt{background:var(--card);border:3px solid var(--line);border-bottom-width:7px;border-radius:18px;padding:18px 8px;font-family:var(--display);font-size:26px}
.kopt.ok,.pb.ok{border-color:var(--ok);background:var(--ok-bg);animation:pop .35s}
.kopt.no,.pb.no{border-color:var(--no);background:var(--no-bg);animation:shake .4s}
.kopt.dim{opacity:.45}
/* 짝맞추기 */
.pairs{display:grid;grid-template-columns:1fr 1.4fr;gap:12px 16px;width:100%;max-width:560px}
.pcol{display:flex;flex-direction:column;gap:10px}
.pb{height:60px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:16px;font-family:var(--display);font-size:22px;display:grid;place-items:center;transition:opacity .3s,transform .12s}
.pb.snd{color:var(--sky)}
.pb.snd svg{width:32px;height:32px}
.pb.sel{border-color:var(--sky);background:#E3F0FD;transform:scale(1.04)}
.pb.done{opacity:.25;pointer-events:none;border-color:var(--ok);background:var(--ok-bg)}
/* 피드백 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;z-index:5}
.sheet.ok{background:var(--ok-bg)}
.sheet.no{background:var(--no-bg)}
.sh-in{display:flex;flex-direction:column;gap:10px;max-width:620px;margin:0 auto}
.sh-t{font-family:var(--display);font-size:26px}
.sheet.ok .sh-t{color:var(--ok-d)}
.sheet.no .sh-t{color:var(--no-d)}
.sh-s{display:flex;align-items:center;gap:10px;font-size:18px;flex-wrap:wrap}
.sh-s .se{font-size:34px;line-height:1}
.sh-s b{font-family:var(--word);font-size:32px}
.btn{font-family:var(--display);font-size:22px;padding:13px 24px;border:none;border-radius:16px;background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go-d);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--go-d)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky-d)}
.btn.wide{width:100%}
.sheet.ok .btn{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.sheet.no .btn{background:var(--no);box-shadow:0 5px 0 var(--no-d)}

/* ---------- 결과 ---------- */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-block:20px;overflow-y:auto;max-width:560px;margin:0 auto;width:100%}
.res .critter{width:140px;height:140px}
.res h1{font-family:var(--display);font-weight:400;font-size:36px;margin:0;color:var(--ok-d)}
.rstars{display:flex;gap:8px}
.rstars svg{width:56px;height:56px;fill:#C9D6CE;transform:scale(.4);opacity:0;transition:transform .35s cubic-bezier(.3,1.8,.6,1),opacity .2s}
.rstars svg.in{transform:scale(1);opacity:1}
.rstars svg.f{fill:var(--star)}
.res p{margin:0;font-size:18px}
.badge{background:var(--star);color:var(--ink);font-family:var(--display);font-size:20px;padding:6px 16px;border-radius:99px;box-shadow:0 4px 0 #D9A000;animation:pop .5s}
.rwords{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wchip{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 12px;font-family:var(--word);font-weight:700;font-size:20px;display:inline-flex;align-items:center;gap:6px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.center{align-items:center}
.center .panel{border-radius:24px;max-width:380px;margin:0 16px;align-items:center;text-align:center}
.center .critter{width:110px;height:110px}
.center p{margin:0;font-size:18px}
.center #shost{width:150px;height:150px}
#startBox .btn{font-size:26px;padding:16px}
.center h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--ok-d)}
.bagtabs{display:flex;gap:6px}
.bagtabs .tab{font-size:15px;padding:6px}
.bagcat{font-family:var(--display);font-size:16px;color:var(--soft);margin:8px 0 6px}
.bw.no{opacity:.45}
.legend{display:flex;gap:12px;font-size:13px;color:var(--soft);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;vertical-align:-2px;margin-right:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(92%,480px);background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.homechip{text-decoration:none;color:var(--ink)}
/* 음성 게임·말로 답하기·목소리 효과 */
.ropts.vhide{display:none}
.ropts.vhelp{animation:pop .4s}
.vlive{position:absolute;left:10px;top:10px;z-index:6;background:rgba(255,255,255,.9);border-radius:99px;padding:4px 12px;font-family:var(--display);font-size:15px;display:flex;align-items:center;gap:6px;max-width:80%}
.vlive i{font-style:normal;font-family:var(--word);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vdot{width:10px;height:10px;border-radius:50%;background:#E5484D;animation:recP .9s infinite;flex:none}
.garena.g-feed{background:linear-gradient(#FFE8C7,#FFD9A0 70%,#E9B872);height:min(46vh,380px)}
.feeder{position:absolute;left:50%;bottom:8%;width:min(200px,42%);transform:translateX(-50%);line-height:0}
.feeder svg{width:100%;height:auto}

.vpw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vprec{display:flex;align-items:center;gap:12px;justify-content:center}

/* 1단계 따라 말하기 검사 */
.vtarget{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
.vtl{font-family:var(--display);font-size:16px;color:#D63A69}
.vts{display:flex;align-items:center;gap:10px;background:#FFF0F5;border:3px solid #FF5C8A;border-radius:18px;padding:6px 16px;font-family:var(--word);font-size:34px;color:var(--ink);box-shadow:0 4px 0 #F4B6CB}

.vc{display:flex;align-items:center;gap:14px;justify-content:center}

.vct{display:flex;flex-direction:column;gap:2px;min-width:150px}

/* 말하기 */
.spcard{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:600px}
.sppic .pic{font-size:90px}
.spline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.turtle{width:48px;height:48px;border-radius:50%;border:none;background:#E3F0FD;font-size:26px;box-shadow:0 4px 0 #B9D6F2}
.sptext{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--word);font-weight:700;font-size:clamp(28px,7vw,42px);border-bottom:3px dotted var(--line);padding:2px 4px}
.spw{border-radius:10px;padding:0 4px;transition:background .2s,color .2s}
.spw.hit{color:var(--ok-d);background:var(--ok-bg)}
.spw.miss{color:var(--no-d);background:var(--no-bg)}
.spL{font-size:clamp(70px,18vw,110px);color:var(--sky-d);line-height:1}
.spL small{font-size:.6em;color:var(--vow);margin-left:12px}
.spkey{display:inline-grid;place-items:center;min-width:56px;border:3px dashed var(--star);border-radius:12px;background:var(--hint);font-size:.9em;padding:0 6px}
.spkey .numpic,.spkey .swatch{font-size:36px}
.spmic{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigmic{position:relative;width:110px;height:110px;border-radius:50%;border:none;background:var(--sky);box-shadow:0 7px 0 var(--sky-d);display:grid;place-items:center}
.bigmic .mi{font-size:52px;position:relative;z-index:1}
.bigmic .mw{position:absolute;inset:0;border-radius:50%}
.bigmic.on{background:#FF5C8A;box-shadow:0 7px 0 #D63A69}
.bigmic.on .mw{animation:mwave 1.1s ease-out infinite;box-shadow:0 0 0 0 rgba(255,92,138,.6)}
@keyframes mwave{to{box-shadow:0 0 0 26px rgba(255,92,138,0)}}
.bigmic:active{transform:translateY(4px);box-shadow:0 3px 0 var(--sky-d)}
.mlab{font-family:var(--display);font-size:20px;color:var(--sky-d)}
.heard{min-height:24px;font-family:var(--word);font-size:20px;color:var(--soft);text-align:center}
.hint.big{font-family:var(--display);font-size:22px;color:var(--ink)}
/* 미니게임 */
.ghead{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;flex-wrap:wrap;justify-content:space-between}
.gname{font-family:var(--display);font-size:18px;background:var(--card);border-radius:99px;padding:4px 12px;border:2px solid var(--line)}
.gscore{font-family:var(--display);font-size:18px;color:var(--go-d)}
.gprompt{border:3px solid var(--star);background:#FFF8E1;border-radius:18px;padding:6px 16px;display:flex;align-items:center;gap:10px;font-family:var(--display);flex:1;justify-content:center;min-width:180px}
.gprompt.pop{animation:pop .35s}
.gprompt small{font-size:14px;color:var(--soft)}
.gW,.gL{font-family:var(--word);font-weight:700;font-size:38px;line-height:1}
.gL.up{color:var(--sky-d)}.gL{color:var(--vow)}
.gK{font-size:30px}
.gP{font-size:52px;line-height:1}
.garena{position:relative;width:100%;max-width:640px;height:min(50vh,430px);border-radius:24px;overflow:hidden;border:3px solid var(--line)}
.garena.g-balloon{background:linear-gradient(#9ED8FF,#E6F6FF 70%,#CFF0D8)}
.bal{position:absolute;bottom:-150px;width:92px;height:110px;border:none;padding:0;background:none;animation:balRise var(--d) linear forwards}
.bal .bi{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.65) 0 10%,transparent 11%),var(--c);display:grid;place-items:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);animation:sway 1.6s ease-in-out infinite alternate}
.bal .bi::after{content:"";position:absolute;bottom:-30px;left:50%;width:2px;height:30px;background:rgba(30,43,55,.35)}
.bal .bc{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:38px;line-height:1}
.bal .bc.lo{font-family:var(--word);font-weight:700;font-size:44px;color:var(--vow)}
.bal .bc .numpic,.bal .bc .swatch{font-size:40px}
.bal.pop .bi{animation:popB .3s ease-out forwards}
.bal.fade{opacity:0;transition:opacity .3s}
.bal.nope .bi{animation:shake .4s}
@keyframes balRise{to{transform:translateY(calc(-1 * var(--h)))}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes popB{50%{transform:scale(1.35);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.garena.g-mole{background:linear-gradient(#BFE9C9,#8FD19E);display:flex;align-items:center;justify-content:center}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;width:100%;padding:10px 14px}
.hole{position:relative;height:clamp(120px,19vh,170px);overflow:hidden}
.hole::after{content:"";position:absolute;left:8%;right:8%;bottom:4px;height:30px;border-radius:50%;background:#5B3A1E;box-shadow:inset 0 6px 0 #3E2712;z-index:2;pointer-events:none}
.mole{position:absolute;left:50%;bottom:10px;width:min(118px,90%);transform:translate(-50%,110%);transition:transform .22s cubic-bezier(.3,1.5,.6,1);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;z-index:1}
.hole.up .mole{transform:translate(-50%,6%)}
.mole .mface{width:84%;line-height:0}
.mole .mface svg{width:100%;height:auto}
.mole .msign{background:#fff;border:3px solid #8A5C30;border-radius:12px;padding:2px 8px;font-family:var(--word);font-weight:700;font-size:clamp(16px,3.6vw,24px);line-height:1.2;white-space:nowrap;margin-bottom:-6px;z-index:1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hole.bonk .mole{animation:bonk .4s ease}
.mole.nope{animation:shake .4s}
@keyframes bonk{30%{transform:translate(-50%,30%) scale(1.15,.75)}100%{transform:translate(-50%,6%)}}
.garena.g-run{height:min(36vh,280px);background:linear-gradient(#BDE3FF,#EAF7FF)}
.g-run .sky{position:absolute;inset:0 0 30%;background:radial-gradient(circle at 15% 30%,#fff 0 22px,transparent 23px),radial-gradient(circle at 70% 45%,#fff 0 18px,transparent 19px);background-size:420px 100%;animation:clouds 9s linear infinite}
.g-run .ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#8BCB72 0 40px,#7ABD61 40px 80px);border-top:6px solid #5FA046;animation:ground .5s linear infinite}
@keyframes clouds{to{background-position-x:-420px}}
@keyframes ground{to{background-position-x:-80px}}
.runner{position:absolute;left:5%;bottom:24%;width:140px;z-index:2}
.runner svg{width:100%;height:auto;display:block}
.runner .leg{transform-box:fill-box;transform-origin:50% 0;animation:legA .18s ease-in-out infinite alternate}
.runner .leg.b{animation-name:legB}
.runner.jump{animation:rjump .7s cubic-bezier(.3,.8,.5,1)}
.runner.trip{animation:rtrip 1.2s ease}
@keyframes rjump{50%{transform:translateY(-110px) rotate(-10deg)}}
@keyframes rtrip{20%{transform:rotate(25deg) translateY(10px)}80%{transform:rotate(25deg) translateY(10px)}}
.hurdle{position:absolute;bottom:24%;left:105%;font-size:58px;line-height:1;z-index:1}
.hurdle.go{animation:hurdle var(--t) linear forwards}
.hurdle.goV{animation:hurdleV 3s ease-out forwards}
@keyframes hurdleV{from{left:105%}to{left:32%}}
.gmic{display:flex;align-items:center;gap:12px;justify-content:center}
@keyframes hurdle{from{left:105%}to{left:20%}}
.ropts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px}
.ropt{flex:1;min-width:110px;background:var(--card);border:3px solid var(--line);border-bottom-width:7px;border-radius:18px;padding:14px 10px;font-family:var(--word);font-weight:700;font-size:26px}
.ropt.lo{font-size:44px;color:var(--vow)}
.ropt.ok{border-color:var(--ok);background:var(--ok-bg)}
.ropt.nope{animation:shake .4s;border-color:var(--no);background:var(--no-bg)}
.ropt.dim,.ropt:disabled{opacity:.45}
.gdone{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55);font-family:var(--display);font-size:46px;z-index:5;animation:pop .4s}
/* 따라 말하기 */
.micbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.micbtn{display:flex;align-items:center;gap:8px;border:none;border-radius:99px;padding:10px 20px 10px 12px;background:#FF5C8A;color:#fff;box-shadow:0 5px 0 #D63A69;font-family:var(--display);font-size:20px}
.micbtn .mi{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px}
.micbtn.rec{background:#E5484D;animation:recP .8s ease-in-out infinite}
.micbtn.busy:not(.rec){opacity:.8}
@keyframes recP{50%{box-shadow:0 5px 0 #B82F34,0 0 0 12px rgba(229,72,77,.25)}}
.meter{display:flex;gap:4px;align-items:center;height:42px}
.meter i{width:7px;height:100%;border-radius:4px;background:#FF5C8A;transform:scaleY(.15);transition:transform .08s}
.btn:disabled{opacity:.5}
/* 큰 3D 주사위 */
.diceStage{position:fixed;inset:0;z-index:60;pointer-events:none;animation:dstage 2.5s ease forwards}
@keyframes dstage{0%{background:rgba(30,43,55,0)}12%,80%{background:rgba(30,43,55,.32)}100%{background:rgba(30,43,55,0)}}
.dfly{position:fixed;left:0;top:0;width:var(--size);height:var(--size);perspective:700px}
.cube3d{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cube3d .face{position:absolute;inset:0;border-radius:22%;background:radial-gradient(circle at 30% 25%,#fff 0 40%,#FFF4D6 100%);border:3px solid #F2C94C;box-shadow:inset 0 0 0 6px rgba(255,255,255,.6),inset -8px -10px 18px rgba(214,160,40,.25);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;backface-visibility:hidden}
.cube3d .face i{display:block;margin:auto;width:70%;height:70%;border-radius:50%}
.cube3d .face i.on{background:radial-gradient(circle at 35% 30%,#FF8A8A,#E5484D 60%,#B82F34)}
.cube3d .face.f1 i.on{background:radial-gradient(circle at 35% 30%,#FF9E5E,#FF6B1A 60%,#C24A00);width:95%;height:95%}
.dfly.glow .cube3d .face{box-shadow:inset 0 0 0 6px rgba(255,255,255,.6),0 0 30px 8px rgba(255,194,46,.8)}
.dshadow{position:fixed;width:140px;height:26px;border-radius:50%;background:#1E2B37;opacity:0;filter:blur(4px)}
.dlabel{position:fixed;transform:translate(-50%,-50%) scale(.3);opacity:0;font-family:var(--display);font-size:34px;color:#fff;background:var(--go);padding:6px 20px;border-radius:99px;box-shadow:0 5px 0 var(--go-d);white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.8,.6,1),opacity .2s}
.dlabel.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.dice.launch .dcube{visibility:hidden}
.dice{animation:diceWiggle 2.4s ease-in-out infinite}
@keyframes diceWiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg) scale(1.08)}90%{transform:rotate(10deg) scale(1.08)}95%{transform:rotate(-5deg)}}
/* 주사위 */
.dicebar{display:flex;align-items:center;gap:12px;background:#FFF4D6;border:3px dashed var(--star);border-radius:18px;padding:8px 12px}
.dicebar b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.dicebar small{color:var(--soft);font-size:13px}
.dice{position:relative;width:64px;height:64px;border:none;border-radius:16px;background:#fff;box-shadow:0 5px 0 #F2C94C;font-size:40px;line-height:1;flex:none;display:grid;place-items:center}
.dice .dn{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--go);color:#fff;font-family:var(--display);font-size:15px;display:grid;place-items:center;padding:0 5px}
.dice.roll .dcube{animation:dice .8s cubic-bezier(.3,1.2,.6,1)}
@keyframes dice{0%{transform:rotate(0) scale(1)}30%{transform:rotate(300deg) scale(1.3) translateY(-14px)}70%{transform:rotate(620deg) scale(.9)}100%{transform:rotate(720deg) scale(1)}}
.prevwrap.flip{animation:flipOut .8s ease}
.prevwrap.newset .wp{animation:pop .45s ease backwards}
.prevwrap.newset .wp:nth-child(2){animation-delay:.05s}.prevwrap.newset .wp:nth-child(3){animation-delay:.1s}.prevwrap.newset .wp:nth-child(4){animation-delay:.15s}.prevwrap.newset .wp:nth-child(5){animation-delay:.2s}.prevwrap.newset .wp:nth-child(6){animation-delay:.25s}
@keyframes flipOut{40%{transform:rotateX(70deg);opacity:.3}100%{transform:rotateX(0);opacity:1}}
/* 회화 */
.bubble b.en{display:block;font-family:var(--word);font-weight:700;font-size:24px}
.bubble small{display:block;font-family:var(--body);font-size:15px;color:var(--soft);margin-top:2px}
.cpic{display:flex;justify-content:center}
.cpic .pic{font-size:80px}
.bigL{font-family:var(--word);font-weight:700;font-size:100px;color:var(--sky-d);background:var(--card);border:4px solid var(--line);border-radius:22px;padding:0 24px;line-height:1.2}
.many{display:grid;grid-template-columns:repeat(6,auto);gap:4px;font-size:34px;line-height:1.1;max-width:300px;justify-content:center}
.me{display:flex;align-items:center;gap:10px;align-self:flex-end;max-width:100%;flex-wrap:wrap;justify-content:flex-end}
.meav{width:52px;height:52px;border-radius:50%;background:#FFE3C7;display:grid;place-items:center;font-size:32px;order:2;flex:none}
.mel{font-family:var(--display);font-size:18px;color:var(--soft)}
.mebub{background:var(--sky);color:#fff;border-radius:20px 20px 4px 20px;padding:10px 16px;font-family:var(--word);font-weight:700;font-size:28px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.mebub .blank{background:#fff;min-width:90px;height:52px;font-size:28px;padding:0 8px}
.reps{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;align-items:stretch}
.rep{display:flex;gap:8px;align-items:stretch}
.rep .rplay{width:56px;border:none;border-radius:16px;background:#E3F0FD;color:var(--sky);display:grid;place-items:center;flex:none}
.rep .rplay svg{width:26px;height:26px}
.rep .rtxt{flex:1;text-align:left;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:12px 16px;font-family:var(--word);font-weight:700;font-size:24px}
.rep.ok .rtxt{border-color:var(--ok);background:var(--ok-bg);animation:pop .35s}

.kopt.cm{font-size:22px}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sw{font-family:var(--word);font-weight:700;font-size:26px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;padding:6px 14px;line-height:1.2;color:var(--ink)}

.sw.ok{border-color:var(--ok);background:var(--ok-bg)}
.sw.no{border-color:var(--no);background:var(--no-bg)}
.pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.built{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;min-width:200px;padding:6px 10px;border-radius:20px 20px 4px 20px;background:#E3F0FD;border:3px dashed var(--sky)}

.built.no{border-style:solid;border-color:var(--no);background:var(--no-bg);animation:shake .4s}
.cq{width:100%;font-family:var(--word);font-size:18px;color:var(--soft)}
.sh-s b.sent-b{font-size:26px}
/* 알파벳 */
.abcic{font-family:var(--word);font-weight:700;font-size:34px;color:var(--ink)}
.abctab{background:#FFF4D6;box-shadow:0 4px 0 #F2C94C}
.abcw{font-family:var(--word);font-weight:700;font-size:24px}
.wp .w.abcw{font-size:28px}
.wprev.abcall{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.wprev.abcall .w{font-size:20px}
.abcBig{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.abcBig span{font-family:var(--word);font-weight:700;line-height:1;padding:8px 18px 14px;border-radius:22px;background:var(--card);border:4px solid var(--line);border-bottom-width:9px;cursor:pointer;transition:transform .15s,background .15s}
.abcBig .up{font-size:clamp(84px,22vw,130px);color:var(--sky-d)}
.abcBig .lo{font-size:clamp(70px,18vw,110px);color:var(--vow)}
.abcBig.one span{cursor:pointer}
.abcBig span.on,.abcEx.on{background:var(--hint);border-color:var(--star);transform:translateY(-6px) scale(1.05)}

.abcEx .kor{display:block;font-size:16px}
.exw{font-family:var(--word);font-weight:700;font-size:34px}
.exw.big{font-size:52px;display:flex;align-items:center}

let ac;
function actx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type='triangle',g=.16){const a=actx();if(!a)return;const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={
  ok(){tone(784,0,.14);tone(1175,.1,.28)},
  no(){tone(311,0,.16,'square',.06);tone(233,.14,.26,'square',.06)},
  tap(){tone(660,0,.07,'triangle',.08)},
  combo(n){[0,1,2].forEach(i=>tone(660+n*40+i*180,i*.07,.18))},
  star(i){tone(880+i*220,0,.22);tone(1320+i*220,.05,.2,'sine',.08)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3))},
  fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.35))},
  whoosh(){const a=actx();if(!a)return;const len=a.sampleRate*.5,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const n=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain(),t=a.currentTime;n.buffer=b;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2600,t+.35);
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.22,t+.12);v.gain.exponentialRampToValueAtTime(.001,t+.45);n.connect(f).connect(v).connect(a.destination);n.start(t);n.stop(t+.5)}
};

/* ================= 음성 =================
   1) 기기 음성(TTS)이 있으면 그걸로 읽고
   2) 없으면 인터넷 발음 사전(dictionaryapi.dev)의 영어 단어 녹음을 재생 (파일로 크롬에서 열었을 때)
   3) 둘 다 없으면 조용히 넘어감 (화면 글자로 진행) */
const synth=window.speechSynthesis;let V={en:null,ko:null};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function pickVoices(){if(!synth)return;const vs=synth.getVoices();const en=vs.filter(v=>/^en[-_]US/i.test(v.lang));V.en=en.find(v=>/Samantha|Google US English|Jenny|Aria|Ava/i.test(v.name))||en[0]||vs.find(v=>/^en/i.test(v.lang))||null;V.ko=vs.find(v=>/^ko/i.test(v.lang))||null}
if(synth){pickVoices();synth.onvoiceschanged=pickVoices}
const ttsOK=()=>!!synth&&synth.getVoices().length>0;
const enCache={};
async function fetchAudio(word){
  const k=word.toLowerCase();if(k in enCache)return enCache[k];
  enCache[k]='';
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k));if(r.ok){const j=await r.json();let u='';for(const e of j)for(const p of (e.phonetics||[]))if(p.audio&&(!u||/-us\.mp3$/.test(p.audio)))u=p.audio;enCache[k]=u}}catch(e){}
  return enCache[k];
}
function prefetch(words){if(!ttsOK())words.forEach(w=>fetchAudio(w.w))}
let sayId=0,talker=null,curAudio=null,lastErr='',spokeOnce=false;
function curHost(){if(!$('#lesson').hidden)return $('#lhost');if(!$('#result').hidden)return $('#rhost');return null}
function say(parts,el,onDone){
  const id=++sayId;
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
  const useTTS=ttsOK();
  let busy=false;
  if(synth){busy=synth.speaking||synth.pending;if(busy)synth.cancel()}
  if(talker)talker.classList.remove('talk');
  talker=el||curHost();
  parts=parts.filter(p=>p[1]!=='ko'||S.ko);
  if(parts.length)Music.duck(true);
  let i=0;
  const step=()=>{
    if(id!==sayId)return;
    if(i>=parts.length){talker&&talker.classList.remove('talk');Music.duck(false);onDone&&onDone();return}
    const [t,lang,opt={}]=parts[i++];
    let done=false,tm;
    const fin=()=>{if(done)return;done=true;clearTimeout(tm);if(id===sayId){talker&&talker.classList.remove('talk');setTimeout(step,opt.gap??140)}};
    const begin=()=>{spokeOnce=true;if(id!==sayId)return;talker&&talker.classList.add('talk');if(lang==='en'&&!opt.onstart)notes(talker);opt.onstart&&opt.onstart()};
    if(!useTTS){
      const u=lang==='en'?enCache[t.toLowerCase()]:'';
      if(!u){opt.onstart&&opt.onstart();tm=setTimeout(fin,lang==='ph'?350:10);return}
      const a=new Audio(u);curAudio=a;a.onplaying=begin;a.onended=fin;a.onerror=fin;tm=setTimeout(fin,4000);
      a.play().catch(fin);return;
    }
    const u=new SpeechSynthesisUtterance(t);
    if(lang==='ko'){u.lang='ko-KR';if(V.ko)u.voice=V.ko;u.rate=1.05;u.pitch=1.35}
    else{u.lang='en-US';if(V.en)u.voice=V.en;u.rate=opt.rate||(lang==='ph'?.9:.78);u.pitch=1.15}
    tm=setTimeout(fin,(1400+t.length*(lang==='ko'?190:150))/Math.min(1,u.rate));
    u.onend=fin;u.onerror=e=>{lastErr=e&&e.error||'error';fin()};u.onstart=begin;
    try{synth.resume()}catch(e){}
    synth.speak(u);
  };
  if(busy)setTimeout(step,isIOS?80:0);else step();
}

}

const BABY_LINES=['나도!','기다려~','같이 가!','헤헤','영차영차'];
let capyLast=0;
/* 옆으로 달려 지나가기: n마리가 같은 방향·같은 높이로 줄지어 (앞은 엄마·아빠, 뒤로 갈수록 아기) */
function capyParade(n){
  const dir=Math.random()<.5?'right':'left',jumpy=Math.random()<.25,baseY=14+Math.random()*34,dur=(1.5+Math.random()*.4)*1.25;
  const sizes=[150,140,112,100,90,82,76,70];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const c=document.createElement('div'),w=sizes[Math.min(i,sizes.length-1)];
      c.className=`capy ${dir}${jumpy?' jumpy':''}`;
      c.style.setProperty('--y',`calc(${baseY}vh + ${150-w}px * .6)`);c.style.setProperty('--w',w+'px');
      c.style.setProperty('--run',dir==='right'?'runR':'runL');c.style.setProperty('--dur',dur+'s');
      const say=i===0?rnd(CAPY_PRAISE):(i===n-1&&n>=3?rnd(BABY_LINES):'');
      c.innerHTML=`<div class="cb">${say?`<div class="cbub${i?' small':''}">${say}</div>`:''}<span class="dust">💨</span>${capySVG(i>=2)}</div>`;
      $('#fx').appendChild(c);if(i<3)sfx.whoosh();
      setTimeout(()=>c.remove(),dur*1000+100);
    },i*300);
  }
}

  setTimeout(()=>{const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,['⭐','✨','🧡'],12,160);sfx.whoosh()},2050);

/* combo = 연속 정답 수 → 3콤보부터 가족이 한 마리씩 늘어남(최대 8마리). 그 전에는 랜덤으로 달려가기 또는 다가오기 */
function capyRun(combo=1,force){
  if(RM)return;
  const now=Date.now();if(now-capyLast<500)return;capyLast=now;
  if(force==='parade')return capyParade(combo);
  if(combo>=3)return capyParade(Math.min(combo,8));
  if(Math.random()<.4)capyApproach();else capyParade(1);
}
/* ================= 배경음악 =================
   음원 파일 없이 Web Audio로 직접 연주하는 경쾌한 칩튠 (C장조, 132BPM, 8마디 반복)
   - 멜로디(사각파) + 통통 튀는 베이스 + 엇박 코드 + 킥·스네어·하이햇
   - on(): 1.2초 동안 서서히 커짐 / off(초): 서서히 줄어든 뒤 정지 / duck(): 캐릭터가 말할 때 잠깐 작게 */
const Music=(()=>{
  const VOL=.13,BPM=132,E8=60/BPM/2;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const PROG=[[48,[60,64,67]],[43,[59,62,67]],[45,[57,60,64]],[41,[57,60,65]],[48,[60,64,67]],[43,[59,62,67]],[41,[57,60,65]],[43,[59,62,67]]];
  const MEL=[
    [76,0,79,76,72,0,74,76],[74,0,71,74,79,0,77,74],[72,0,76,72,69,0,72,76],[77,76,74,72,74,0,0,0],
    [76,0,79,0,84,0,79,76],[74,76,74,71,67,0,71,74],[77,0,81,77,76,0,74,72],[74,0,71,0,72,0,0,0]];
  let master=null,duckG=null,timer=0,next=0,step=0,playing=false,offT=0,noise=null;
  function ensure(){
    const a=actx();if(!a)return null;
    if(!master){
      master=a.createGain();master.gain.value=0;duckG=a.createGain();duckG.gain.value=1;
      master.connect(duckG).connect(a.destination);
      const len=a.sampleRate*.3;noise=a.createBuffer(1,len,a.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    return a;
  }
  function osc(a,type,f,t,dur,g,dest=master){const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(v).connect(dest);o.start(t);o.stop(t+dur+.02)}
  function kick(a,t){const o=a.createOscillator(),v=a.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);v.gain.setValueAtTime(.9,t);v.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(v).connect(master);o.start(t);o.stop(t+.2)}
  function hiss(a,t,dur,g,hp){const n=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();n.buffer=noise;f.type='highpass';f.frequency.value=hp;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f).connect(v).connect(master);n.start(t);n.stop(t+dur+.02)}
  function play(a,t,i){
    const bar=Math.floor(i/8)%8,e=i%8,[root,ch]=PROG[bar],m=MEL[bar][e];
    if(m)osc(a,'square',mf(m),t,E8*.9,.16);
    if(m&&e%2===0)osc(a,'triangle',mf(m+12),t,E8*.5,.05);
    const bp=[root,0,root+12,0,root,root,root+7,0][e];if(bp)osc(a,'triangle',mf(bp),t,E8*.85,.5);
    if(e%2===1)ch.forEach(n=>osc(a,'square',mf(n),t,E8*.45,.035));
    if(e===0||e===4)kick(a,t);
    if(e===2||e===6)hiss(a,t,.14,.35,1500);
    hiss(a,t,.04,e%2?.12:.07,7000);
  }
  function tick(){const a=actx();if(!a)return;while(next<a.currentTime+.12){play(a,next,step);next+=E8;step=(step+1)%64}}
  function on(){
    const a=ensure();if(!a||a.state!=='running'&&!audioOn)return;
    clearTimeout(offT);
    if(!playing){playing=true;next=a.currentTime+.05;step=0;timer=setInterval(tick,25);tick()}
    const g=master.gain,t=a.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(VOL,t+1.2);
  }
  function off(sec=1.5){
    if(!master||!playing)return;
    const a=actx(),g=master.gain,t=a.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+sec);
    clearTimeout(offT);offT=setTimeout(()=>{clearInterval(timer);playing=false},sec*1000+150);
  }
  function duck(d){if(!duckG)return;const a=actx(),t=a.currentTime,g=duckG.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(d?.35:1,t+.25)}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)off(.3);else if(S.music&&!$('#home').hidden&&audioOn)on()});
  return {on,off,duck,get playing(){return playing}};
})();

   🎤 → 원래 발음 듣기 → 삑 → 2.6초 녹음(소리 크기 막대) → 원래 발음 → 내 목소리 재생 → 칭찬 */
const Mic={ok:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),stream:null,denied:false,busy:false};
async function micStream(){
  if(Mic.stream&&Mic.stream.active)return Mic.stream;
  try{Mic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});return Mic.stream}
  catch(e){Mic.denied=true;return null}
}
function micRelease(){if(Mic.stream){Mic.stream.getTracks().forEach(t=>t.stop());Mic.stream=null}}
function recordVoice(ms,onLevel){
  return new Promise(async res=>{
    const stm=await micStream();if(!stm)return res(null);
    let mr;try{mr=new MediaRecorder(stm)}catch(e){return res(null)}
    const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    let raf=0,an=null;const a=actx();
    if(a){try{const src=a.createMediaStreamSource(stm);an=a.createAnalyser();an.fftSize=256;src.connect(an)}catch(e){}}
    const buf=new Uint8Array(256);
    const tick=()=>{if(an){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));onLevel&&onLevel(Math.min(1,m/70))}raf=requestAnimationFrame(tick)};tick();
    mr.onstop=()=>{cancelAnimationFrame(raf);res(chunks.length?URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'})):null)};
    mr.start();setTimeout(()=>{if(mr.state!=='inactive')mr.stop()},ms);
  });
}

const TENW={20:'twenty',30:'thirty',40:'forty',50:'fifty',60:'sixty',70:'seventy',80:'eighty',90:'ninety'};

// 인식기가 자주 다른 철자로 적는 소리 같은 단어
const HOMO={two:'to too',four:'for fore',eight:'ate',one:'won',eye:'i aye',bee:'be b',pear:'pair pare',ant:'aunt and aint',red:'read',blue:'blew',tea:'t tee',sun:'son',hair:'hare',meat:'meet',flower:'flour',bear:'bare',deer:'dear',nose:'knows',sea:'see',see:'sea c',night:'knight',no:'know',write:'right',hi:'high',by:'buy bye',ate:'eight',rose:'rows',nut:'not',mail:'male',tail:'tale',knee:'nee',toe:'tow',plane:'plain',van:'ban fan',pen:'pan pin',leg:'lag',bed:'bad bet',pig:'big',cup:'cop',bat:'bad',hat:'had',jet:'jab',ox:'ax oaks',owl:'al',egg:'eg',ear:'here year',arm:'um',lip:'lit',key:'kee',box:'bucks',bus:'boss',kiwi:'cui'};
// 소리 기준 철자 (모음 유지): ph→f, 겹자음 하나로, c→k/s, 부드러운 g→j, 끝 묵음 e 제거

const GREET_SHORT=[{q:'Hello!',qk:'안녕!',a:'Hi!',ak:'안녕!'},{q:'Goodbye!',qk:'잘 가!',a:'Bye!',ak:'안녕!'},{q:"Let's play!",qk:'같이 놀자!',a:'OK!',ak:'좋아!'},{q:'Do you like English?',qk:'영어 좋아해?',a:'Yes!',ak:'응!'},{q:'Thank you!',qk:'고마워!',a:'Welcome!',ak:'천만에!'}].map((g,i)=>({...g,id:'gs'+i,tpl:'greet'}));

let vfxTapBroken=false;
function vfxTap(){
  if(!S.vfx||S.vfx==='normal'||vfxTapBroken||!Mic.ok||Mic.denied)return null;
  const t={mr:null,chunks:[],stopped:false};
  micStream().then(stm=>{
    if(!stm||t.stopped)return;
    try{t.mr=new MediaRecorder(stm);t.mr.ondataavailable=e=>{if(e.data&&e.data.size)t.chunks.push(e.data)};t.mr.start()}catch(e){t.mr=null}
  });
  return t;
}
// 녹음을 멈추고 변조해서 들려준 다음 then() 실행 (변조가 꺼져 있으면 바로 실행)
function vfxAfter(t,err,then){
  if(!t)return then();
  t.stopped=true;
  if(err==='audio-capture'){vfxTapBroken=true;micRelease();toast('이 기기에서는 말 인식과 목소리 변조를 같이 쓸 수 없어서 변조를 쉴게요.');return then()}
  const mr=t.mr;
  if(!mr||mr.state==='inactive'){micRelease();return then()}
  mr.onstop=()=>{micRelease();
    if(!t.chunks.length)return then();
    const url=URL.createObjectURL(new Blob(t.chunks,{type:mr.mimeType||'audio/webm'}));
    const h=curHost();if(h){act(h,'happy',900);emote(h,FXS.find(f=>f[0]===S.vfx)[1])}
    Music.duck(true);playFx(url,S.vfx,()=>{Music.duck(false);setTimeout(then,150)});
  };
  try{mr.stop()}catch(e){micRelease();then()}
}
function micListenOnce(ui,onAlts,onBroken){

  let rec;try{rec=new SR()}catch(e){srBroken=true;return onBroken&&onBroken()}
  rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=10;rec.continuous=false;curRec=rec;
  const alts=[];let interim='',err='';
  ui.btn.classList.add('on');if(ui.lab)ui.lab.textContent='듣고 있어… 말해 봐!';if(ui.heard)ui.heard.textContent='';
  const h=$('#lhost');act(h,'lean',2500);emote(h,'👂');tone(880,0,.12,'sine',.12);
  rec.onresult=e=>{let txt='';for(let i=0;i<e.results.length;i++){const r=e.results[i];txt+=r[0].transcript;for(let k=0;k<r.length;k++){const tx=r[k].transcript;if(tx&&!alts.includes(tx))alts.push(tx)}}interim=txt;if(ui.heard)ui.heard.textContent=txt};
  rec.onerror=e=>{err=e.error||'error'};
  rec.onend=()=>{if(curRec!==rec)return;curRec=null;clearTimeout(rec._t);ui.btn.classList.remove('on');if(ui.lab)ui.lab.textContent='다시 눌러서 말하기';
    vfxAfter(tap,err,()=>{if(tap&&err==='audio-capture')err='';
    if(BROKEN_ERR.includes(err)){srBroken=true;toast(err==='network'?'말 인식은 인터넷이 필요해요.':'이 기기에서는 말 인식을 쓸 수 없어요. (크롬 마이크 권한을 확인해 주세요)');return onBroken&&onBroken()}
    if(!alts.length&&interim)alts.push(interim);onAlts(alts)})};
  rec._t=setTimeout(()=>{try{rec.stop()}catch(e){}},6000);

/* ================= 목소리 효과 (다람쥐·거인·로봇·메아리) ================= */
const FXS=[['normal','🙂','그대로'],['squirrel','🐿️','다람쥐'],['giant','🐻','거인'],['monster','👹','괴물'],['laugh','🤣','웃음'],['robot','🤖','로봇'],['echo','🏔️','메아리']];
const fxCache={};
const FX_RATE={squirrel:1.75,giant:.62,monster:.55,laugh:1.4};
// 녹음 소리를 가장 큰 소리 기준으로 키워서(정규화) 작게 녹음돼도 크게 들리게
function fxGain(buf){let pk=0;for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i+=4){const v=Math.abs(d[i]);if(v>pk)pk=v}}return pk>0.005?Math.min(12,.95/pk):1}
async function playFx(url,fx,onEnd){
  const a=actx();if(!a||!url)return onEnd&&onEnd();
  let ended=false;const end=()=>{if(ended)return;ended=true;onEnd&&onEnd()};
  try{
    try{if(a.state==='suspended')await a.resume()}catch(e){}
    if(!fxCache[url])fxCache[url]=await a.decodeAudioData(await (await fetch(url)).arrayBuffer());
    const buf=fxCache[url],rate=FX_RATE[fx]||1;
    const src=a.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;
    setTimeout(end,buf.duration/rate*1000+(fx==='echo'?1400:fx==='laugh'?750:200));
    // 소리 키우기 → 압축기(찢어지지 않게) → 스피커
    const comp=a.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=10;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;
    const out=a.createGain();out.gain.value=1.6;comp.connect(out).connect(a.destination);
    const pre=a.createGain();pre.gain.value=fxGain(buf);pre.connect(comp);
    const lfo=(f,depth,target,type='sine')=>{const o=a.createOscillator();o.type=type;o.frequency.value=f;const g=a.createGain();g.gain.value=depth;o.connect(g).connect(target);o.start();return o};
    const stopAll=os=>{src.onended=()=>{os.forEach(o=>{try{o.stop()}catch(e){}});end()}};
    if(fx==='robot'){const g=a.createGain();g.gain.value=0;stopAll([lfo(48,1,g.gain,'square')]);src.connect(g).connect(pre);src.start();return}
    if(fx==='monster'){
      // 아주 낮게 + 거칠게(일그러뜨림) + 그르렁 떨림
      const ws=a.createWaveShaper();const n=1024,cv=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cv[i]=Math.tanh(x*6)}ws.curve=cv;ws.oversample='2x';
      const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
      const trem=a.createGain();trem.gain.value=.75;
      const o1=lfo(28,.25,trem.gain),o2=lfo(5,.04,src.playbackRate);
      const dry=a.createGain();dry.gain.value=.5;src.connect(dry).connect(trem);
      src.connect(ws).connect(lp).connect(trem);trem.connect(pre);pre.gain.value=pre.gain.value*.8;
      stopAll([o1,o2]);src.start();return}
    if(fx==='laugh'){
      // 높은 목소리가 "하하하" 하고 빠르게 출렁이며 끊김
      const trem=a.createGain();trem.gain.value=.55;
      const o1=lfo(7,.45,trem.gain,'triangle'),o2=lfo(7,.28,src.playbackRate,'triangle');
      src.connect(trem).connect(pre);src.onended=()=>{[o1,o2].forEach(o=>{try{o.stop()}catch(e){}});setTimeout(end,650)};src.start();
      giggle(a,comp,buf.duration/rate);return}
    if(fx==='echo'){const d=a.createDelay(1);d.delayTime.value=.3;const fb=a.createGain();fb.gain.value=.5;src.connect(pre);src.connect(d);d.connect(fb).connect(d);d.connect(pre);src.start();return}
    src.connect(pre);src.start();
  }catch(e){const au=new Audio(url);au.volume=1;au.playbackRate=FX_RATE[fx]||1;try{au.preservesPitch=false;au.mozPreservesPitch=false;au.webkitPreservesPitch=false}catch(_){}au.onended=au.onerror=end;au.play().catch(end)}
}
// 웃음 변조 끝에 붙는 "히히히" 소리
function giggle(a,dest,at){
  const t0=a.currentTime+at+.05;
  [0,.13,.26,.39].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';const t=t0+d,f=900-i*60;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.7,t+.11);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g).connect(dest);o.start(t);o.stop(t+.13)});
}

  // [알파벳] ABC 순서: 빈자리 글자 찾기
  aOrder(s,q){
    const w=s.w,cs=s.cs,i=w.i,st0=Math.max(0,Math.min(i-3,22)),seq=ABC_SETS[w.si||0].slice(st0,st0+4),ans=cs==='U'?w.U:w.l;s.ans=ans;
    bubble('빈자리에 들어갈 글자는?');
    q.innerHTML=`<div class="seq">${seq.map(x=>x.l===w.l?'<span class="blank" id="blank">?</span>':`<span class="sq">${cs==='U'?x.U:x.l}</span>`).join('')}</div>${lettersHTML(w,cs)}`;
    say([['순서대로 읽어 보고 빈자리를 채워 봐','ko']]);
    hookLetters(q,s,ans,c=>{const b=$('#blank');b.textContent=c;b.classList.add('fill');if(c!==ans){b.classList.add('no');setTimeout(()=>{b.textContent=ans;b.classList.remove('no')},700)}});
  },
  // [알파벳] 대문자 ↔ 소문자 짝맞추기 판
  aPairs(s,q){
    const W=s.ws;bubble('대문자와 소문자 짝꿍을 찾아 줘');
    say([['대문자와 소문자 짝꿍을 찾아 줘!','ko']]);
    q.innerHTML=`<div class="pairs abcp"><div class="pcol">${shuffle(W).map(w=>`<button class="pb up" data-id="${w.id}">${w.U}</button>`).join('')}</div><div class="pcol">${shuffle(W).map(w=>`<button class="pb lo" data-id="${w.id}">${w.l}</button>`).join('')}</div></div>`;
    let A=null,B=null,matched=0;const missed=new Set();
    const clear=()=>{[A,B].forEach(b=>b&&b.classList.remove('sel'));A=B=null};
    const check=()=>{
      if(!A||!B)return;const a=A,b=B,w=W.find(x=>x.id===a.dataset.id);
      if(a.dataset.id===b.dataset.id){
        a.classList.add('ok');b.classList.add('ok');sfx.ok();{const [ax,ay]=ctr(a),[bx,by]=ctr(b);burst(ax,ay,['⭐','✨'],6,70);burst(bx,by,['⭐','✨'],6,70);floatText((ax+bx)/2,(ay+by)/2,'+10')}
        setTimeout(()=>{a.classList.add('done');b.classList.add('done')},350);
        if(!missed.has(w.id))rec(w,true);
        L.combo++;L.best=Math.max(L.best,L.combo);comboUI();act($('#lhost'),'happy');emote($('#lhost'),rnd(['⭐','❤️','👍']));
        clear();if(++matched===W.length){save();setTimeout(()=>answer(true,s),600)}
      }else{
        a.classList.add('no');b.classList.add('no');sfx.no();L.mistakes++;L.combo=0;comboUI();act($('#lhost'),'puzzle',900);emote($('#lhost'),'🤔');
        missed.add(w.id);rec(w,false);setTimeout(()=>{a.classList.remove('no');b.classList.remove('no')},450);clear();
      }
    };
    q.querySelectorAll('.pb.up').forEach(b=>b.onclick=()=>{if(L.lock||b.classList.contains('done'))return;const w=W.find(x=>x.id===b.dataset.id);say([[NAME[w.l],'ph']]);if(A)A.classList.remove('sel');A=b;b.classList.add('sel');check()});
    q.querySelectorAll('.pb.lo').forEach(b=>b.onclick=()=>{if(L.lock||b.classList.contains('done'))return;sfx.tap();if(B)B.classList.remove('sel');B=b;b.classList.add('sel');check()});
  },
  // 소리-뜻 짝맞추기 판
  pairs(s,q){
    const W=s.ws;bubble('소리를 누르고 맞는 뜻을 찾아 봐');
    say([['소리를 누르고, 맞는 뜻을 찾아 짝지어 봐!','ko']]);
    q.innerHTML=`<div class="pairs"><div class="pcol">${shuffle(W).map(w=>`<button class="pb snd" data-id="${w.id}" aria-label="소리 듣기">${SPK}</button>`).join('')}</div><div class="pcol">${shuffle(W).map(w=>`<button class="pb ko" data-id="${w.id}">${w.k}</button>`).join('')}</div></div>`;
    let selS=null,selK=null,matched=0;const missed=new Set();
    const clear=()=>{[selS,selK].forEach(b=>b&&b.classList.remove('sel'));selS=selK=null};
    const check=()=>{
      if(!selS||!selK)return;
      const a=selS,b=selK,w=W.find(x=>x.id===a.dataset.id);
      if(a.dataset.id===b.dataset.id){
        a.classList.add('ok');b.classList.add('ok');sfx.ok();{const [ax,ay]=ctr(a),[bx,by]=ctr(b);burst(ax,ay,['⭐','✨'],6,70);burst(bx,by,['⭐','✨'],6,70);floatText((ax+bx)/2,(ay+by)/2,'+10');emote($('#lhost'),rnd(['⭐','❤️','👍']))}
        setTimeout(()=>{a.classList.add('done');b.classList.add('done')},350);
        if(!missed.has(w.id))rec(w,true);
        L.combo++;L.best=Math.max(L.best,L.combo);comboUI();mood($('#lhost'),'happy');
        clear();
        if(++matched===W.length){save();setTimeout(()=>answer(true,s),600)}
      }else{
        a.classList.add('no');b.classList.add('no');sfx.no();L.mistakes++;L.combo=0;comboUI();act($('#lhost'),'puzzle',900);emote($('#lhost'),'🤔');
        missed.add(w.id);rec(w,false);
        const bw=W.find(x=>x.id===b.dataset.id);missed.add(bw.id);
        setTimeout(()=>{a.classList.remove('no');b.classList.remove('no')},450);clear();
      }
    };
    q.querySelectorAll('.pb.snd').forEach(b=>b.onclick=()=>{if(L.lock||b.classList.contains('done'))return;const w=W.find(x=>x.id===b.dataset.id);sayWord(w);if(selS)selS.classList.remove('sel');selS=b;b.classList.add('sel');check()});
    q.querySelectorAll('.pb.ko').forEach(b=>b.onclick=()=>{if(L.lock||b.classList.contains('done'))return;sfx.tap();if(selK)selK.classList.remove('sel');selK=b;b.classList.add('sel');check()});
  }
};
function answer(ok,s){
  if(L.lock)return;L.lock=true;keyH=null;
  const isPairs=s.t==='pairs'||s.t==='aPairs'||s.t==='mg',w=s.w;
  const isSp=s.t.startsWith('sp');
  if(!isPairs&&!w.convo&&!isSp)rec(w,ok);
  clearTimeout(nudgeT);
  const h=$('#lhost'),zone=$('#q .garena')||$('#q .spcard')||$('#q .slots')||$('#q .kopts')||$('#q .pairs')||$('#q .reps')||$('#q .me')||$('#q'),[zx,zy]=ctr(zone);
  if(ok){L.correct++;if(!isPairs){L.combo++;L.best=Math.max(L.best,L.combo);sfx.ok();if(L.combo>=3&&L.combo%3===0){const cb=L.combo;setTimeout(()=>sfx.combo(cb),250)}}
    burst(zx,zy,['⭐','✨','🌟'],14,130);floatText(zx,zy-40,L.combo>=3?`+${10+L.combo*2}`:'+10');
    {const cb=L.combo;setTimeout(()=>isPairs?capyRun(3,'parade'):capyRun(cb),200)}
    if(L.combo>=3){act(h,'dance',1800);emote(h,'🔥');if(L.combo%5===0)confetti()}else{act(h,'happy');emote(h,rnd(['⭐','❤️','😆','👍','🎉']))}}
  else{L.mistakes++;L.combo=0;sfx.no();act(h,'sweat',1800);emote(h,rnd(['💦','😅','🤔']));if(!s.retry)L.queue.push({...s,retry:true})}
  save();bar();comboUI();
  const msg=ok?(L.combo>=3&&!isPairs?`${L.combo} 콤보! ${rnd(PRAISE)}`:rnd(PRAISE)):rnd(OOPS);bubble(msg);
  const sh=$('#sheet');sh.className='sheet '+(ok?'ok':'no');
  $('#shT').textContent=s.t==='mg'?`${GAMES[s.game].i} ${GAMES[s.game].n} 끝!`:isPairs?'짝맞추기 성공!':(ok?msg:'괜찮아! 정답은…');
  $('#shS').innerHTML=w&&w.convo?(s.t==='cMeaning'?`<b class="sent-b">${w.q}</b><span>${w.qk}</span>`:`<span class="cq">${w.q}</span><b class="sent-b">→ ${w.a}</b><span>${w.ak}</span>`):s.t==='mg'?`<span>⭐ ${s.hits}/6 성공!</span>`:isPairs?`<span>${s.ws.length}쌍을 모두 찾았어!</span>`:w.abc?`<b class="abcw">${w.U} ${w.l}</b><span class="se">${pic(w.e)}</span><span>${w.w} · ${w.k}</span>`:`<span class="se">${pic(w.e)}</span><b>${w.w}</b><span>${w.k}</span>`;
  if((isSp||s.t==='sayPic'||s.t==='cVoice'||s.t==='cBlank')&&s.heard)$('#shS').insertAdjacentHTML('beforeend',`<span class="cq">🎤 내가 한 말: "${esc(s.heard)}"</span>`);
  $('#shBtn').textContent=ok?'계속':'알겠어';
  sh.hidden=false;
  if(s.t==='mg')say([['보너스 게임 끝! 잘했어!','ko']]);else if(isPairs)say([['짝맞추기 성공!','ko']]);
  else if(w.convo)setTimeout(()=>say([[ok?'정답!':'정답은','ko'],[s.t==='cMeaning'?w.q:w.a,'en']]),250);
  else setTimeout(()=>say([[ok?'정답!':'정답은','ko'],...(w.abc?[[NAME[w.l],'ph',{gap:250}]]:[]),[w.w,'en']]),250);
}
function next(){L.pos++;if(L.pos>=L.queue.length)finish();else renderStep()}
$('#shBtn').onclick=()=>{sfx.tap();next()};
$('#quit').onclick=()=>{$('#quitBox').hidden=false;mood($('#qhost'),'oops');say([['벌써 그만할 거야?','ko']],$('#qhost'))};
$('#qStay').onclick=()=>{$('#quitBox').hidden=true};
$('#qLeave').onclick=()=>{$('#quitBox').hidden=true;synth&&synth.cancel();stopGame();stopListen();micRelease();L=null;keyH=null;renderHome()};

/* ================= 결과 ================= */
let pendingLvUp=0;
function finish(){
  stopGame();micRelease();
  const stars=L.mistakes===0?3:L.mistakes<=2?2:1,UN=unitsOf(L.lv),key=`${L.lv}:${UN[L.ci].id}`,STP=stepsOf(L.lv,L.ci);
  const p=prog(L.lv,L.ci).slice();const wasClear=p.every(x=>x>0);
  p[L.step]=Math.max(p[L.step],stars);S.p[key]=p;S.stars+=stars;
  const t=dayStr();
  if(S.lastDay!==t){S.streak=S.lastDay===dayStr(-1)?S.streak+1:1;S.lastDay=t}
  if(S.goalDay!==t){S.goalDay=t;S.goalCount=0}
  S.goalCount++;
  const nowClear=p.every(x=>x>0),c=UN[L.ci];
  if(L.lv===0){if(nowClear&&lvClearCount(0)===UN.length&&!S.abcDone){S.abcDone=true;S.view=1;pendingLvUp='abc'}}
  else if(nowClear&&lvClearCount(L.lv)===10&&S.lv===L.lv&&L.lv<3){S.lv++;S.view=S.lv;pendingLvUp=S.lv}
  else if(nowClear&&lvClearCount(L.lv)===10&&L.lv===3&&!S.allDone){S.allDone=true;pendingLvUp=4}
  save();
  const rh=$('#rhost');setHost(rh,c.host);
  const title=stars===3?'완벽해!':stars===2?'아주 잘했어!':'끝까지 해냈어!';
  $('#rTitle').textContent=title;
  $('#rStars').innerHTML=stars3(stars);
  const b=$('#rBadge');
  if(nowClear&&!wasClear){b.textContent=`🏅 ${c.name} 클리어!`;b.hidden=false}else b.hidden=true;
  const g=S.goalCount;
  const nextTxt=L.step<NSTEP-1?`다음은 「${STP[L.step+1].n}」!`:'';
  $('#rMsg').textContent=(L.best>=3?`최고 ${L.best} 콤보! `:'')+(g===GOAL?`오늘 목표 달성! `:g<GOAL?`오늘 목표까지 ${GOAL-g}칸. `:'')+nextTxt;
  $('#rWords').innerHTML=(L.lv===0&&c.all?[]:L.W).map(w=>`<button class="wchip" data-id="${w.id}">${w.abc?`<span class="abcw">${w.U}${w.l}</span> ${pic(w.e)}`:`${pic(w.e)} ${w.w}`}</button>`).join('');
  $('#rBtn').textContent=L.step<NSTEP-1?`${STP[L.step+1].n} 하기`:(L.lv===0?'다음 글자 고르기':'카테고리 고르기');
  show('result');
  $('#rStars').querySelectorAll('svg').forEach((s,i)=>setTimeout(()=>{s.classList.add('in');if(i<stars)sfx.star(i)},400+i*380));
  setTimeout(()=>{act(rh,'dance',3500);emote(rh,stars===3?'🏆':'🎉')},300);
  sfx.win();confetti();
  setTimeout(()=>say([[title+(nowClear&&!wasClear?` ${c.name} 클리어!`:''),'ko']],rh),900);
}
$('#rWords').addEventListener('click',e=>{const b=e.target.closest('.wchip');if(!b)return;const w=byId(b.dataset.id);if(w.abc)say([[NAME[w.l],'ph'],[w.w,'en']],$('#rhost'));else sayWord(w,$('#rhost'))});
$('#rBtn').onclick=()=>{
  sfx.tap();const l=L;L=null;
  if(pendingLvUp){showLvUp(pendingLvUp);pendingLvUp=0;renderHome();return}
  if(l&&l.step<NSTEP-1){startLesson(l.lv,l.ci,l.step+1);return}
  renderHome();
};
function showLvUp(n){
  setHost($('#uhost'),'momo');
  if(n==='abc'){$('#uTitle').textContent='알파벳 마스터!';$('#uMsg').textContent='A부터 Z까지 대문자, 소문자를 모두 익혔어! 이제 레벨 1에서 단어를 배워 보자.'}
  else if(n===4){$('#uTitle').textContent='모든 레벨 클리어!';$('#uMsg').textContent='단어 180개를 모두 배웠어! 이제 카테고리를 다시 돌며 별 3개를 모아 보자.'}
  else{$('#uTitle').textContent=`${LEVELS[n].n} 열림!`;$('#uMsg').textContent=`카테고리 10개를 모두 깼어! 이제 ${LEVELS[n].d} 단어에 도전하자.`}
  $('#lvup').hidden=false;sfx.fanfare();confetti();act($('#uhost'),'dance',4000);
  setTimeout(()=>say([[$('#uTitle').textContent,'ko']],$('#uhost')),500);
}
$('#uBtn').onclick=()=>{$('#lvup').hidden=true;renderHome()};
function confetti(){const box=$('#confetti');box.innerHTML='';const cols=['#FF8A3D','#FFC22E','#22A563','#3E95E6','#FF7A93','#86C1FF'];for(let i=0;i<34;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'%';s.style.background=rnd(cols);s.style.animationDuration=(1.8+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(s)}setTimeout(()=>box.innerHTML='',4200)}

/* ================= 단어 가방 ================= */
let bagLv=1;
function renderBag(){
  $('#bagTabs').innerHTML=[1,2,3].map(i=>`<button class="tab${bagLv===i?' on':''}" data-lv="${i}">${LEVELS[i].n}</button>`).join('');
  $('#bagGrid').innerHTML=CATS.map(c=>`<div class="bagcat">${c.icon} ${c.name}</div><div class="wprev">${[...new Set(c.lv[bagLv-1].flat())].map(w=>{const r=S.w[w.id];return `<button class="wp bw${mastered(w)?' got':r?'':' no'}" data-w="${w.id}"><span class="e">${pic(w.e)}</span><span class="w">${w.w}</span><span class="k">${w.k}</span></button>`}).join('')}</div>`).join('');
}
$('#bagBtn').onclick=()=>{bagLv=Math.max(1,S.view);renderBag();$('#bag').hidden=false};
$('#bagTabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){bagLv=+b.dataset.lv;renderBag()}});
$('#bagGrid').addEventListener('click',e=>{const b=e.target.closest('.wp');if(b){actx();const w=ALLW.find(x=>x.id===b.dataset.w);if(ttsOK())sayWord(w);else fetchAudio(w.w).then(()=>sayWord(w))}});
$('#bagX').onclick=()=>$('#bag').hidden=true;
$('#bag').addEventListener('click',e=>{if(e.target.id==='bag')$('#bag').hidden=true});

const PEEK=['나도 놀러 왔어!','오늘 무슨 단어 배울래?','여기 숨어 있었지롱!','별 많이 모았네!','나 찾았다!'];
let peekBusy=false;
function peek(){
  if(peekBusy||$('#home').hidden||!$('#startBox').hidden||!$('#catSheet').hidden||!$('#bag').hidden||Date.now()-lastInput>60000)return;
  peekBusy=true;const p=$('#peeker');
  setHost($('#peekC'),rnd(Object.keys(HOSTS)));$('#peekSay').textContent=rnd(PEEK);$('#peekSay').hidden=true;
  p.classList.add('up');setTimeout(()=>{$('#peekSay').hidden=false;act($('#peekC'),'hopS',600)},600);
  setTimeout(()=>{p.classList.remove('up');peekBusy=false},4200);
}
setInterval(peek,22000);setTimeout(peek,6000);
if(location.protocol!=='file:')$('#homeLink').hidden=false;
renderHome();
setHost($('#shost'),'momo');
